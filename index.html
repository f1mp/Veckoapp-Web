<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Veckoapp</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><div class="brand"><span class="logo">V</span><div><b>Veckoapp</b><small>Mitt arbetsschema</small></div></div><button id="export" class="subtle">Exportera</button></header><section class="hero"><span id="today"></span><div class="week"><div><small>VECKA</small><strong id="week">—</strong></div><span id="parityLabel"></span></div><div class="todayShift" id="todayShift"></div></section><div class="heading"><h2>Veckoschema</h2><div class="toggle"><button data-parity="1">Udda</button><button data-parity="0">Jämn</button></div></div><section class="days" id="days"></section><section class="editor"><div class="editorhead"><h2 id="editTitle">Redigera dag</h2><span id="saved">Sparas automatiskt</span></div><label class="check"><input type="checkbox" id="off"> Ledig dag</label><div class="fields"><label>Arbetet börjar<input type="time" id="start"></label><label>Arbetet slutar<input type="time" id="end"></label></div><label>Alarmtyp<select id="mode"><option value="0">Inget alarm</option><option value="1">Manuellt alarm</option><option value="2">Automatiskt före arbetet</option><option value="3">Båda</option></select></label><div class="fields"><label>Manuell alarmtid<input type="time" id="manual"></label><label>Minuter före arbetet<input type="number" id="lead" min="0" max="720" step="5"></label></div><div class="actions"><button id="copy">Kopiera dag</button><button id="paste" class="subtle" disabled>Klistra in dag</button></div><p class="notice">Alarmtiderna sparas i schemat, men webbläsaren kan inte väcka dig när telefonen är låst.</p></section><footer><label class="import">Importera schema <input type="file" id="import" accept="application/json,.json"></label><span>Fungerar offline efter första besöket</span></footer></main><script src="./app.js" defer></script></body></html>
